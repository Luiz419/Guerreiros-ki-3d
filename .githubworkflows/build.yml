name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Montar projeto Android
        run: |
          mkdir -p _apk/app/src/main/java/com/guerreiroki/game _apk/app/src/main/assets _apk/app/src/main/res/values
          cd _apk
          cp ../index.html app/src/main/assets/index.html
          curl -fsSL -o app/src/main/assets/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'GuerreiroKi'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.4' apply false }
          EOF
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.guerreiroki.game'
            compileSdk 34
            defaultConfig { applicationId "com.guerreiroki.game"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Guerreiro Ki" android:hardwareAccelerated="true" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/guerreiroki/game/MainActivity.java <<'EOF'
          package com.guerreiroki.game;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            private WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(true);
              w.setWebViewClient(new WebViewClient());
              w.setWebChromeClient(new WebChromeClient());
              w.setOverScrollMode(View.OVER_SCROLL_NEVER);
              w.loadUrl("file:///android_asset/index.html");
            }
            @Override public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULL_SCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
            }
            @Override protected void onPause() { super.onPause(); w.onPause(); }
            @Override protected void onResume() { super.onResume(); w.onResume(); }
            @Override protected void onDestroy() { w.destroy(); super.onDestroy(); }
          }
          EOF
      - name: Compilar APK
        working-directory: _apk
        run: gradle assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Guerreiro Ki APK
Os outros arquivos soltos podem ficar, o novo build não usa nenhum. Se o build falhar, abra a execução na aba Actions, copie a mensagem de erro em vermelho e me envie.
