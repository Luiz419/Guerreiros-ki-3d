name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.4 }
      - name: Baixar three.js para uso offline
        run: curl -L -o app/src/main/assets/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: GuerreiroKi-apk, path: app/build/outputs/apk/debug/app-debug.apk }
